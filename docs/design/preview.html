<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>LingKo Blue App Prototype v2</title>
  <style>
    :root {
      --blue-800:#174f82; --blue-700:#245f9b; --blue-600:#2f73b9;
      --blue-500:#4f91d1; --blue-400:#7fb4e5; --blue-300:#a9caeb;
      --blue-200:#d6e8f7; --blue-100:#edf6fd; --blue-50:#f7fbff;
      --ink-950:#102b40; --ink-900:#17324a; --ink-700:#3f596e;
      --ink-500:#667d90; --ink-400:#8a9aa8; --line:#dce7ef;
      --surface:#f6f9fb; --white:#fff; --green:#2e866a; --green-soft:#eaf7f2;
      --amber:#9d681a; --amber-soft:#fff6df; --red:#b94a4a; --red-soft:#fff0f0;
      --shadow:0 18px 55px rgba(23,50,74,.14); --shadow-soft:0 6px 20px rgba(23,50,74,.075);
      --r-xs:10px; --r-sm:14px; --r-md:18px; --r-lg:24px; --nav-h:76px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;color:var(--ink-900);background:radial-gradient(circle at 50% 0,rgba(169,202,235,.35),transparent 440px),#edf3f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;line-height:1.4}
    button,input,textarea,select{font:inherit;color:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #f2a640;outline-offset:2px}
    .stage{min-height:100%;display:grid;place-items:center;padding:24px}
    .phone{position:relative;width:min(100%,402px);height:min(876px,calc(100vh - 48px));min-height:690px;overflow:hidden;border:9px solid #153149;border-radius:42px;background:#fff;box-shadow:var(--shadow)}
    .statusbar{height:29px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;background:#fff;font-size:11px;font-weight:850}
    .app{position:relative;height:calc(100% - 29px);overflow:hidden;background:#fff}
    .screen{display:none;height:100%;overflow-y:auto;overscroll-behavior:contain;padding:15px 18px calc(var(--nav-h) + 22px);background:#fff;scrollbar-width:none}
    .screen::-webkit-scrollbar{display:none}.screen.active{display:block}.screen.no-nav{padding-bottom:22px}
    .topbar{min-height:47px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .topbar h1{margin:0;font-size:20px;letter-spacing:-.025em}.brand{margin:0;font-size:25px;font-weight:950;letter-spacing:-.045em}
    .icon-btn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:var(--blue-50);font-size:18px}.icon-btn.ghost{border-color:transparent;background:transparent}
    .greeting{margin:3px 0 15px;font-size:17px;font-weight:900}.eyebrow{margin-bottom:7px;color:var(--ink-500);font-size:12px;font-weight:850}
    .card{padding:15px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;box-shadow:var(--shadow-soft)}.card+.card{margin-top:11px}
    .progress-card{display:grid;grid-template-columns:88px 1fr;gap:15px;align-items:center}.ring{--value:60;width:82px;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--blue-600) calc(var(--value)*1%),#e7eef4 0)}.ring>div{width:64px;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;background:#fff}.ring strong{font-size:21px}
    .bar{height:7px;overflow:hidden;border-radius:999px;background:#e7eef4}.bar>span{display:block;height:100%;border-radius:inherit;background:var(--blue-600)}.tiny{color:var(--ink-500);font-size:12px}
    .quota{display:grid;grid-template-columns:42px 1fr 22px;gap:12px;align-items:center}.round-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;color:var(--blue-700);background:var(--blue-100);font-size:18px}.quota-num{font-size:23px;font-weight:950}
    .section-row{min-height:38px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:17px}.section-row h2{margin:0;font-size:16px;letter-spacing:-.02em}.text-btn{min-height:40px;padding:7px 4px;border:0;color:var(--blue-700);background:transparent;font-size:13px;font-weight:850}
    .list,.history,.stage-list{overflow:hidden;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;box-shadow:var(--shadow-soft)}
    .sentence-row{width:100%;min-height:65px;display:grid;grid-template-columns:38px 1fr 31px;gap:10px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left}.sentence-row:last-child{border-bottom:0}.play-dot{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--blue-200);border-radius:50%;color:var(--blue-700);background:var(--blue-50)}.ko-line{font-size:14px;font-weight:900}.sub-line{display:block;margin-top:2px;color:var(--ink-500);font-size:11px}
    .primary,.secondary,.outline,.danger{min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 16px;border-radius:15px;font-weight:900}.primary{width:100%;border:1px solid var(--blue-600);color:#fff;background:linear-gradient(180deg,#4387ca,#286eae);box-shadow:0 8px 18px rgba(47,115,185,.23)}.secondary{border:1px solid var(--line);background:#fff}.outline{width:100%;border:1px solid var(--blue-500);color:var(--blue-700);background:#fff}.danger{width:100%;border:1px solid #efcaca;color:var(--red);background:var(--red-soft)}.primary:disabled{border-color:#ccd8e0;color:#748592;background:#e9eff3;box-shadow:none;cursor:not-allowed}.main-cta{margin-top:13px}
    .active-job{width:100%;min-height:65px;display:grid;grid-template-columns:42px 1fr 24px;gap:10px;align-items:center;margin-top:11px;padding:10px 12px;border:1px solid var(--blue-200);border-radius:var(--r-md);background:var(--blue-50);text-align:left}.active-job strong{display:block;font-size:13px}.active-job small{color:var(--ink-500)}
    .bottom-nav{position:absolute;z-index:30;left:0;right:0;bottom:0;height:var(--nav-h);display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:rgba(255,255,255,.965);backdrop-filter:blur(14px)}.nav-btn{display:grid;place-items:center;align-content:center;gap:3px;border:0;color:var(--ink-400);background:transparent;font-size:10px;font-weight:850}.nav-icon{width:34px;height:28px;display:grid;place-items:center;border-radius:999px;font-size:17px}.nav-btn.active{color:var(--blue-700)}.nav-btn.active .nav-icon{background:var(--blue-100)}
    .focus-card{padding:23px 16px;text-align:center;background:linear-gradient(180deg,var(--blue-50),#fff)}.focus-card .sentence{margin:0;font-size:22px;font-weight:950;letter-spacing:-.025em}.translation{margin:7px 0 0;font-size:13px;font-weight:750}
    .guides{display:flex;flex-wrap:wrap;gap:8px}.guide{min-height:38px;padding:8px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:13px;font-weight:850}.guide small{color:var(--ink-500);font-weight:700}.listen-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .pronunciation-card{background:var(--blue-50)}.pronunciation-label{display:block;margin-bottom:5px;color:var(--ink-500);font-size:11px;font-weight:850}.pronunciation-source{font-size:16px}.pronunciation-divider{height:1px;margin:13px 0;background:var(--line)}.pronunciation-target{display:block;margin:7px 0 13px;color:var(--blue-700);font-size:24px;line-height:1.35}.pronunciation-title{display:flex;align-items:center;gap:6px;color:var(--blue-700);font-size:12px;font-weight:900}
    .practice-pronunciation{margin-top:13px;padding:11px 13px;border:1px solid var(--blue-200);border-radius:12px;background:#fff;text-align:center}.practice-pronunciation strong{display:block;margin-top:4px;color:var(--blue-700);font-size:17px}
    .sentence-composer{padding:16px;background:var(--blue-50)}.sentence-composer textarea{width:100%;min-height:76px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:13px;resize:vertical;background:#fff;font:inherit}.prepare-status{display:none;align-items:center;gap:7px;margin-top:10px;color:var(--ink-500);font-size:12px;font-weight:850}
    .record-layout{min-height:100%;display:flex;flex-direction:column}.record-body{flex:1;display:grid;place-items:center;text-align:center;padding:2px 0 14px}.timer-ring{width:194px;height:194px;display:grid;place-items:center;margin:20px auto 10px;border-radius:50%;background:conic-gradient(var(--blue-600) 0 38%,#e7eef4 38%)}.timer-ring>div{width:168px;height:168px;display:grid;place-items:center;align-content:center;border-radius:50%;background:#fff}.timer-ring strong{font-size:40px;line-height:1}.timer-ring span{margin-top:5px;color:var(--ink-500);font-size:12px}
    .wave{height:57px;display:flex;align-items:center;justify-content:center;gap:4px;margin:17px 0}.wave i{display:block;width:4px;border-radius:999px;background:var(--blue-600);animation:wave 1.15s ease-in-out infinite}.wave i:nth-child(1){height:15px}.wave i:nth-child(2){height:27px}.wave i:nth-child(3){height:42px}.wave i:nth-child(4){height:25px}.wave i:nth-child(5){height:36px}.wave i:nth-child(6){height:18px}.wave i:nth-child(7){height:46px}.wave i:nth-child(8){height:31px}.wave i:nth-child(9){height:20px}.wave i:nth-child(10){height:39px}.wave i:nth-child(11){height:22px}@keyframes wave{0%,100%{transform:scaleY(.55);opacity:.55}50%{transform:scaleY(1);opacity:1}}
    .record-controls{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:12px;align-items:end}.record-control{min-height:68px;display:grid;place-items:center;align-content:center;gap:6px;border:0;background:transparent;font-size:11px;font-weight:850}.control-circle{width:46px;height:46px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:18px}.stop-circle{width:62px;height:62px;display:grid;place-items:center;border:5px solid var(--blue-200);border-radius:50%;color:#fff;background:var(--blue-600);font-size:22px}
    .recorded-panel{margin-top:17px;padding:16px;border:1px solid var(--blue-200);border-radius:var(--r-md);background:var(--blue-50)}.recorded-row{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center}.recorded-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
    .evaluation-hero{text-align:center;padding:13px 8px 17px}.analysis-icon{width:86px;height:86px;display:grid;place-items:center;margin:0 auto 14px;border-radius:28px;color:var(--blue-700);background:var(--blue-100);font-size:34px}.evaluation-hero h2{margin:0;font-size:20px}.evaluation-hero p{margin:8px 0 0;color:var(--ink-500);font-size:13px}
    .stage-row{min-height:66px;display:grid;grid-template-columns:42px 1fr 30px;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}.stage-row:last-child{border-bottom:0}.stage-row strong{display:block;font-size:13px}.stage-row small{color:var(--ink-500)}.check{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;color:#fff;background:var(--green);font-size:12px;font-weight:900}.spinner{width:24px;height:24px;border:3px solid var(--blue-200);border-top-color:var(--blue-600);border-radius:50%;animation:spin .85s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .info-box{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;margin-top:14px;padding:13px;border:1px solid var(--blue-200);border-radius:var(--r-md);background:var(--blue-50);font-size:12px}
    .score-hero{display:grid;grid-template-columns:126px 1fr;gap:15px;align-items:center}.score-ring{width:118px;height:118px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--blue-600) 0 87%,#e7eef4 87%)}.score-ring>div{width:94px;height:94px;display:grid;place-items:center;align-content:center;border-radius:50%;background:#fff}.score-ring strong{font-size:35px;line-height:1}.score-ring small{color:var(--ink-500)}.score-copy h2{margin:0 0 6px;font-size:18px}.score-copy p{margin:0;color:var(--ink-500);font-size:12px}
    .metric{display:grid;grid-template-columns:88px 1fr 43px;gap:9px;align-items:center;min-height:35px;font-size:12px}.metric-track{height:7px;overflow:hidden;border-radius:999px;background:#e7eef4}.metric-track span{display:block;height:100%;border-radius:inherit;background:var(--blue-600)}
    .syllables{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.syllable{padding:9px 3px 8px;border:1px solid var(--line);border-radius:12px;text-align:center;background:#fff}.syllable strong{display:block;font-size:16px}.syllable span{display:block;margin-top:4px;font-size:11px;font-weight:900}.syllable.excellent{border-color:#b9dfd0;background:var(--green-soft)}.syllable.good{border-color:#efd49a;background:var(--amber-soft)}.syllable.needs{border-color:#edc5c5;background:var(--red-soft)}.syllable.excellent span{color:var(--green)}.syllable.good span{color:var(--amber)}.syllable.needs span{color:var(--red)}.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;color:var(--ink-500);font-size:10px;font-weight:750}.legend i{display:inline-block;width:8px;height:8px;margin-right:4px;border-radius:50%}
    .feedback-list{display:grid;gap:8px}.feedback-item{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:14px;background:#fff}.feedback-char{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;color:var(--red);background:var(--red-soft);font-size:18px;font-weight:950}.feedback-item strong{display:block;font-size:13px}.feedback-item small{color:var(--ink-500)}
    .trend svg{width:100%;height:118px}.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:0 0 auto;min-height:36px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink-500);background:#fff;font-size:12px;font-weight:850}.filter.active{color:var(--blue-700);border-color:var(--blue-300);background:var(--blue-100)}
    .history-row{width:100%;min-height:67px;display:grid;grid-template-columns:46px 1fr 22px;gap:11px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left}.history-row:last-child{border-bottom:0}.history-score{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--blue-700);background:var(--blue-100);font-weight:950}
    .profile-card{display:grid;grid-template-columns:58px 1fr;gap:13px;align-items:center}.avatar{width:58px;height:58px;display:grid;place-items:center;border-radius:19px;color:var(--blue-700);background:var(--blue-100);font-size:25px;font-weight:950}.badge{display:inline-flex;align-items:center;min-height:25px;margin-top:4px;padding:4px 8px;border-radius:999px;color:var(--blue-700);background:var(--blue-100);font-size:10px;font-weight:900}.settings{padding:0 14px}.setting{width:100%;min-height:55px;display:grid;grid-template-columns:1fr auto 20px;gap:9px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font-size:13px}.setting:last-child{border-bottom:0}.setting span{color:var(--ink-500)}
    .overlay{position:absolute;z-index:80;inset:0;display:none;align-items:end;background:rgba(16,43,64,.36)}.overlay.show{display:flex}.sheet{width:100%;max-height:70%;overflow:auto;padding:12px 18px 24px;border-radius:24px 24px 0 0;background:#fff;box-shadow:0 -18px 45px rgba(23,50,74,.18)}.handle{width:42px;height:5px;margin:0 auto 14px;border-radius:999px;background:#d7e1e8}.sheet h2{margin:0 0 14px;font-size:19px}.sheet-option{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left}.sheet-option:last-child{border-bottom:0}
    .toast{position:absolute;z-index:100;left:50%;bottom:calc(var(--nav-h) + 15px);max-width:calc(100% - 32px);transform:translate(-50%,14px);padding:10px 13px;border-radius:12px;color:#fff;background:rgba(23,50,74,.95);box-shadow:var(--shadow-soft);opacity:0;pointer-events:none;transition:.2s;font-size:12px;font-weight:800;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
    .dev-switcher{position:fixed;right:18px;top:18px;z-index:200;display:flex;flex-direction:column;gap:6px;padding:9px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.94);box-shadow:var(--shadow-soft);backdrop-filter:blur(12px)}.dev-switcher button{min-width:112px;min-height:35px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left;font-size:12px;font-weight:800}.dev-switcher button.active{color:var(--blue-700);border-color:var(--blue-200);background:var(--blue-100)}
    @media(max-width:760px){.dev-switcher{display:none}}
    @media(max-width:520px){body{background:#fff}.stage{display:block;padding:0}.phone{width:100%;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}.statusbar{height:calc(29px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}.app{height:calc(100% - 29px - env(safe-area-inset-top))}.bottom-nav{height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}.screen{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 22px)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <div class="dev-switcher" aria-label="개발용 화면 전환">
    <button data-dev="home">Home</button><button data-dev="practice">Practice</button><button data-dev="recording">Recording</button><button data-dev="evaluating">Evaluating</button><button data-dev="result">Result</button><button data-dev="review">Review</button><button data-dev="profile">Profile</button>
  </div>
  <div class="stage">
    <div class="phone" role="application" aria-label="LingKo 파란색 앱 프로토타입">
      <div class="statusbar"><span>9:41</span><span>▮▮ ◉ ▰</span></div>
      <div class="app">
        <section class="screen" data-screen="home"></section>
        <section class="screen" data-screen="practice"></section>
        <section class="screen no-nav" data-screen="recording"></section>
        <section class="screen no-nav" data-screen="evaluating"></section>
        <section class="screen" data-screen="result"></section>
        <section class="screen" data-screen="review"></section>
        <section class="screen" data-screen="profile"></section>
        <nav class="bottom-nav" aria-label="주요 메뉴">
          <button class="nav-btn" data-nav="home"><span class="nav-icon">⌂</span><span>Home</span></button>
          <button class="nav-btn" data-nav="practice"><span class="nav-icon">●</span><span>Practice</span></button>
          <button class="nav-btn" data-nav="review"><span class="nav-icon">▣</span><span>Review</span></button>
          <button class="nav-btn" data-nav="profile"><span class="nav-icon">◉</span><span>Profile</span></button>
        </nav>
        <div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
        <div class="toast" id="toast" role="status"></div>
      </div>
    </div>
  </div>
  <script>
    'use strict';
    const SENTENCES=[
      {ko:'저는 커피를 좋아해요.',pronunciation:'저는 커피를 조아해요.',translation:'I like coffee.',guides:[['저','jeo'],['는','neun'],['커','keo'],['피','pi'],['를','reul'],['좋아해요','joahaeyo']]},
      {ko:'진짜요? 정말 멋져요!',pronunciation:'진짜요? 정말 멋쩌요!',translation:'Really? That’s so cool!',guides:[['진','jin'],['짜','jja'],['요','yo'],['정','jeong'],['말','mal'],['멋져요','meotjyeoyo']]},
      {ko:'내일 날씨가 어때요?',pronunciation:'내일 날씨가 어때요?',translation:'What will the weather be like tomorrow?',guides:[['내','nae'],['일','il'],['날','nal'],['씨','ssi'],['가','ga'],['어때요','eottaeyo']]}
    ];
    const state={screen:'home',selected:0,recordSeconds:0,recorded:false,evaluationStep:2,activeJob:false};
    let recordTimer=null,evaluationTimer=null,toastTimer=null,sentencePrepareTimer=null;
    const qs=(s,r=document)=>r.querySelector(s),qsa=(s,r=document)=>[...r.querySelectorAll(s)];
    const screenEl=name=>qs(`[data-screen="${name}"]`);
    const selected=()=>SENTENCES[state.selected]||SENTENCES[0];
    const navGroup=name=>['practice','recording','evaluating','result'].includes(name)?'practice':name;
    function toast(message){const el=qs('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900)}
    function topbar(title,left='',right=''){return `<div class="topbar">${left?`<button class="icon-btn ghost" data-go="${left}" aria-label="뒤로 가기">‹</button>`:'<span></span>'}<h1>${title}</h1>${right?`<button class="icon-btn ghost" data-action="${right}" aria-label="추가 기능">${right==='help'?'?':'↗'}</button>`:'<span></span>'}</div>`}
    function sentenceRows(){return SENTENCES.map((s,i)=>`<button class="sentence-row" data-select="${i}"><span class="play-dot">▶</span><span><span class="ko-line">${s.ko}</span><span class="sub-line">${s.translation}</span></span><span>☆</span></button>`).join('')}
    function focusCard(){const s=selected();return `<article class="card focus-card"><p class="sentence">${s.ko}</p><p class="translation">${s.translation}</p></article>`}
    function metric(label,value){return `<div class="metric"><span>${label}</span><div class="metric-track"><span style="width:${value}%"></span></div><strong>${value}</strong></div>`}
    function syllable(char,score,kind,feedback){return `<button class="syllable ${kind}" data-syllable="${char}" data-feedback="${feedback}"><strong>${char}</strong><span>${score}</span></button>`}
    function historyRow(score,index,date){const s=SENTENCES[index];return `<button class="history-row" data-history="${index}"><span class="history-score">${score}</span><span><strong class="ko-line">${s.ko}</strong><span class="sub-line">${date}</span></span><span>›</span></button>`}
    function setting(label,value){return `<button class="setting" data-setting="${label}"><strong>${label}</strong><span>${value}</span><b>›</b></button>`}
    function stageRow(index,title,detail){const done=index<state.evaluationStep,active=index===state.evaluationStep;return `<div class="stage-row"><span class="round-icon">${['⇧','▤','⌁','▥'][index]}</span><span><strong>${title}</strong><small>${detail}</small></span>${done?'<span class="check">✓</span>':active?'<span class="spinner"></span>':'<span class="tiny">Wait</span>'}</div>`}
    const renderers={
      home:()=>`<div class="topbar"><p class="brand">LingKo</p><button class="icon-btn ghost" data-action="notifications" aria-label="알림">♧</button></div><p class="greeting">안녕하세요, 민지님! 👋</p><article class="card progress-card"><div class="ring" style="--value:60"><div><strong>60%</strong></div></div><div><div class="eyebrow">Today's progress</div><strong>24 / 40 XP</strong><div class="bar" style="margin:8px 0 9px"><span style="width:60%"></span></div><div class="tiny">🔥 7-day streak</div></div></article><article class="card quota"><span class="round-icon">🎙</span><div><div class="eyebrow">Remaining today</div><span class="quota-num">3</span> <span class="tiny">practices left</span></div><span>›</span></article><div class="section-row"><h2>Recommended for you</h2><button class="text-btn" data-action="see-all">See all</button></div><div class="list">${sentenceRows()}</div><button class="primary main-cta" data-go="practice">🎙 Start practice</button>${state.activeJob?`<button class="active-job" data-go="evaluating"><span class="round-icon">⌁</span><span><strong>Active evaluation</strong><small>Analyzing “${selected().ko}”</small></span><span>›</span></button>`:`<button class="active-job" data-go="review"><span class="round-icon">✓</span><span><strong>Feedback ready</strong><small>Review your latest recording.</small></span><span>›</span></button>`}`,
      practice:()=>`${topbar('Practice','home')}<article class="card sentence-composer"><div class="eyebrow">Practice sentence</div><textarea id="practiceInput" maxlength="100" placeholder="Type a Korean sentence">${selected().ko}</textarea><div class="prepare-status" id="sentencePrepareStatus"></div><div class="practice-pronunciation" id="preparedPractice"><span class="pronunciation-label">Standard pronunciation</span><strong>${selected().pronunciation}</strong></div></article><div id="practiceActions"><div class="section-row"><h2>Listen</h2></div><div class="listen-grid"><button class="secondary" data-action="listen-normal">▶ Normal</button><button class="secondary" data-action="listen-slow">◴ Slow</button></div><button class="primary main-cta" data-go="recording">🎙 Tap to record</button></div>`,
      recording:()=>`<div class="record-layout">${topbar(state.recorded?'Review recording':'Recording','practice')}<div class="record-body"><div style="width:100%">${focusCard()}${state.recorded?`<div class="recorded-panel"><div class="recorded-row"><span class="round-icon">▶</span><span><strong>Recording ready</strong><small class="sub-line">0:${String(Math.max(state.recordSeconds,4)).padStart(2,'0')} · Tap play to preview</small></span><button class="icon-btn" data-action="preview-recording">▶</button></div><div class="recorded-actions"><button class="secondary" data-action="restart-recording">↻ Re-record</button><button class="primary" data-action="submit-evaluation">Evaluate</button></div></div>`:`<div class="timer-ring"><div><strong id="recordTimer">0:00</strong><span>/ 10 sec</span></div></div><div class="wave">${'<i></i>'.repeat(11)}</div><div class="tiny">Speak naturally. Stop when you finish the full sentence.</div>`}</div></div>${state.recorded?'':`<div class="record-controls"><button class="record-control" data-go="practice"><span class="control-circle">×</span><span>Cancel</span></button><button class="record-control" data-action="stop-recording"><span class="stop-circle">■</span><span>Stop</span></button><button class="record-control" data-action="restart-recording"><span class="control-circle">↻</span><span>Restart</span></button></div>`}</div>`,
      evaluating:()=>`${topbar('Evaluating')}<div class="evaluation-hero"><div class="analysis-icon">⌁</div><h2>We’re analyzing your pronunciation</h2><p>You can leave this screen and return anytime. Your evaluation job will be kept.</p></div><div class="stage-list">${stageRow(0,'Audio uploaded','Your recording has been uploaded.')}${stageRow(1,'Job created','Evaluation job has been created.')}${stageRow(2,'Analyzing speech','Accuracy, fluency, completeness, and rhythm.')}${stageRow(3,'Preparing feedback','All syllable scores and summary.')}</div><div class="info-box"><span class="round-icon">◷</span><span>Leaving this screen does not create another evaluation job.</span></div><button class="outline" style="margin-top:14px" data-go="home">Continue in background</button>`,
      result:()=>`${topbar('Result','review','share')}<article class="card score-hero"><div class="score-ring"><div><strong>87</strong><small>/100</small></div></div><div class="score-copy"><h2>Great job! 🎉</h2><p>Your pronunciation is clear. Repeat the full sentence to improve rhythm and consistency.</p></div></article><div class="section-row"><h2>Pronunciation guide</h2></div><article class="card pronunciation-card"><span class="pronunciation-label">Sentence</span><strong class="pronunciation-source">${selected().ko}</strong><div class="pronunciation-divider"></div><span class="pronunciation-title">◉ Standard pronunciation</span><strong class="pronunciation-target">${selected().pronunciation}</strong><div class="listen-grid"><button class="secondary" data-action="listen-normal">▶ Normal</button><button class="secondary" data-action="listen-slow">◴ Slow</button></div></article><div class="section-row"><h2>Score breakdown</h2><button class="text-btn" data-action="score-help">ⓘ</button></div><article class="card">${metric('Accuracy',90)}${metric('Fluency',85)}${metric('Completeness',88)}${metric('Intonation',82)}</article><div class="section-row"><h2>Pronunciation by syllable</h2><button class="text-btn" data-action="syllable-help">ⓘ</button></div><div class="syllables">${syllable('저',92,'excellent','Clear and stable.')}${syllable('는',95,'excellent','Very natural.')}${syllable('커',84,'good','Slight vowel adjustment.')}${syllable('피',76,'good','Release more clearly.')}${syllable('를',88,'excellent','Good tongue movement.')}${syllable('좋',91,'excellent','Strong and accurate.')}${syllable('아',68,'needs','Open the vowel more.')}${syllable('해',82,'good','Keep the rhythm even.')}${syllable('요',94,'excellent','Natural ending tone.')}</div><div class="legend"><span><i style="background:var(--green)"></i>Excellent</span><span><i style="background:var(--amber)"></i>Good</span><span><i style="background:var(--red)"></i>Needs practice</span></div><div class="section-row"><h2>Detailed feedback</h2></div><div class="feedback-list"><div class="feedback-item"><span class="feedback-char">아</span><span><strong>Open the vowel slightly more</strong><small>This is feedback only; retry uses the full sentence.</small></span><strong style="color:var(--red)">68</strong></div><div class="feedback-item"><span class="feedback-char" style="color:var(--amber);background:var(--amber-soft)">피</span><span><strong>Release ㅍ a little more clearly</strong><small>Keep the sentence rhythm continuous.</small></span><strong style="color:var(--amber)">76</strong></div></div><button class="primary main-cta" data-action="retry-sentence">↻ Practice this sentence again</button><button class="outline" style="margin-top:9px" data-go="review">View review history</button>`,
      review:()=>`<div class="topbar"><h1 style="font-size:22px">Review</h1><button class="icon-btn ghost" data-action="filter">≡</button></div><article class="card trend"><div class="eyebrow">Your progress · Last 7 days</div><svg viewBox="0 0 320 118" aria-label="최근 점수 상승 추세"><line x1="24" y1="95" x2="306" y2="95" stroke="#dce7ef"/><line x1="24" y1="55" x2="306" y2="55" stroke="#edf2f6"/><polyline points="28,87 73,73 116,78 160,57 204,48 248,50 299,27" fill="none" stroke="#2f73b9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${[[28,87],[73,73],[116,78],[160,57],[204,48],[248,50],[299,27]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#2f73b9"/>`).join('')}</svg></article><div class="section-row"><h2>Practice history</h2><button class="text-btn" data-action="calendar">Calendar</button></div><div class="filters"><button class="filter active">All</button><button class="filter">Sentences</button><button class="filter">Sounds</button><button class="filter">Latest</button></div><div class="history">${historyRow(87,0,'Today · 9:41 AM')}${historyRow(72,1,'Yesterday · 6:15 PM')}${historyRow(65,2,'Jul 28 · 8:40 AM')}</div><button class="outline" style="margin-top:13px" data-action="retry-sentence">↻ Practice this sentence again</button>`,
      profile:()=>`<div class="topbar"><h1 style="font-size:22px">Profile</h1><button class="icon-btn ghost" data-action="edit-profile">✎</button></div><article class="card profile-card"><div class="avatar">M</div><div><strong>민지 Kim</strong><div class="tiny">minji.kim@example.com</div><span class="badge">Beginner learner</span></div></article><div class="section-row"><h2>Learning preferences</h2></div><article class="card settings">${setting('Display language','English')}${setting('Native language','Korean')}${setting('Target level','Intermediate')}</article><div class="section-row"><h2>App settings</h2></div><article class="card settings">${setting('Notifications','On')}${setting('Sound','On')}${setting('Dark mode','System')}${setting('Privacy & audio','')}${setting('About LingKo','')}</article><button class="danger" style="margin-top:17px" data-action="sign-out">⇥ Sign out</button>`
    };
    function render(name=state.screen){state.screen=name;Object.entries(renderers).forEach(([key,fn])=>{const el=screenEl(key);if(key===name)el.innerHTML=fn()});qsa('.screen').forEach(el=>el.classList.toggle('active',el.dataset.screen===name));qsa('.nav-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.nav===navGroup(name)));qs('.bottom-nav').style.display=['recording','evaluating'].includes(name)?'none':'grid';qsa('[data-dev]').forEach(btn=>btn.classList.toggle('active',btn.dataset.dev===name));bind();screenEl(name).scrollTop=0}
    function go(name){clearInterval(recordTimer);if(name!=='evaluating')clearInterval(evaluationTimer);if(name!=='practice')clearTimeout(sentencePrepareTimer);render(name)}
    function bind(){qsa('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));qsa('[data-select]').forEach(el=>el.onclick=()=>{state.selected=Number(el.dataset.select);go('practice')});qsa('[data-history]').forEach(el=>el.onclick=()=>{state.selected=Number(el.dataset.history);go('result')});qsa('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action));qsa('[data-syllable]').forEach(el=>el.onclick=()=>toast(`${el.dataset.syllable}: ${el.dataset.feedback}`));qsa('[data-setting]').forEach(el=>el.onclick=()=>openSetting(el.dataset.setting));const practiceInput=qs('#practiceInput');if(practiceInput)practiceInput.oninput=preparePracticeSentence;if(state.screen==='recording'&&!state.recorded)startRecordTimer();if(state.screen==='evaluating')startEvaluation()}
    function preparePracticeSentence(event){clearTimeout(sentencePrepareTimer);const input=event.currentTarget;const sanitized=input.value.replace(/[\p{P}\p{S}]/gu,'');const text=sanitized.trim();input.value=sanitized;qs('#preparedPractice').style.display='none';qs('#practiceActions').style.display='none';const status=qs('#sentencePrepareStatus');status.style.display=text?'flex':'none';status.textContent=text?'◷ Preparing standard pronunciation…':'';if(!text)return;sentencePrepareTimer=setTimeout(()=>{SENTENCES.push({ko:text,pronunciation:'Standard pronunciation will be prepared by the API.',translation:'Translation will be prepared by the API.',guides:[...text.replace(/[^\uAC00-\uD7A3]/g,'')].slice(0,8).map(ch=>[ch,''])});state.selected=SENTENCES.length-1;render('practice')},700)}
    function action(type){const messages={notifications:'새 알림이 없습니다.','see-all':'추천 문장 전체 목록 예시입니다.',help:'문장을 듣고 전체 문장을 녹음하세요.','guide-help':'발음 가이드는 참고용이며 한 글자 단독 연습은 제공하지 않습니다.',guide:'가이드 항목은 듣기 참고용입니다.','listen-normal':'일반 속도 음성 재생 예시입니다.','listen-slow':'느린 속도 음성 재생 예시입니다.',share:'결과 공유 예시입니다.','score-help':'모든 점수는 전체 문장 평가 결과입니다.','syllable-help':'모든 음절을 표시하며 부족한 음절만 강조합니다.',filter:'기록 필터 예시입니다.',calendar:'달력 보기 예시입니다.','edit-profile':'프로필 수정 예시입니다.','preview-recording':'녹음 미리 듣기 예시입니다.','sign-out':'프로토타입에서는 로그아웃하지 않습니다.'};if(messages[type])return toast(messages[type]);if(type==='stop-recording'){clearInterval(recordTimer);state.recorded=true;return render('recording')}if(type==='restart-recording'){clearInterval(recordTimer);state.recordSeconds=0;state.recorded=false;toast('녹음을 처음부터 다시 시작합니다.');return render('recording')}if(type==='submit-evaluation'){state.activeJob=true;state.evaluationStep=2;state.recorded=false;return go('evaluating')}if(type==='retry-sentence'){state.recorded=false;return go('practice')}}
    function startRecordTimer(){clearInterval(recordTimer);state.recordSeconds=0;const update=()=>{const el=qs('#recordTimer');if(el)el.textContent=`0:${String(state.recordSeconds).padStart(2,'0')}`;if(state.recordSeconds>=10){clearInterval(recordTimer);state.recorded=true;render('recording');return}state.recordSeconds+=1};update();recordTimer=setInterval(update,1000)}
    function startEvaluation(){clearInterval(evaluationTimer);evaluationTimer=setInterval(()=>{if(state.screen!=='evaluating')return;state.evaluationStep+=1;if(state.evaluationStep>=4){clearInterval(evaluationTimer);state.activeJob=false;setTimeout(()=>go('result'),700)}else render('evaluating')},1500)}
    function openSetting(label){const values={"Display language":['English','한국어','日本語'],"Native language":['Korean','English','Japanese'],"Target level":['Beginner','Intermediate','Advanced'],Notifications:['On','Off'],Sound:['On','Off'],"Dark mode":['System','Light','Dark'],"Privacy & audio":['View audio policy'],"About LingKo":['Version 1.0.0']};const sheet=qs('#sheet');sheet.innerHTML=`<div class="handle"></div><h2>${label}</h2>${(values[label]||['Close']).map(v=>`<button class="sheet-option" data-value="${v}"><span>${v}</span><span>›</span></button>`).join('')}<button class="outline" style="margin-top:12px" data-close-sheet>Close</button>`;qs('#overlay').classList.add('show');qsa('[data-value]',sheet).forEach(btn=>btn.onclick=()=>{toast(`${label}: ${btn.dataset.value}`);closeSheet()});qs('[data-close-sheet]',sheet).onclick=closeSheet}
    function closeSheet(){qs('#overlay').classList.remove('show')}
    qs('#overlay').onclick=e=>{if(e.target.id==='overlay')closeSheet()};qsa('.nav-btn').forEach(btn=>btn.onclick=()=>go(btn.dataset.nav));qsa('[data-dev]').forEach(btn=>btn.onclick=()=>go(btn.dataset.dev));render('home');
  </script>
</body>
</html>
