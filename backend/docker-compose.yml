services:
  mysql:
    image: mysql:8.0
    container_name: lingko-mysql
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Backend는 Compose network로 접속하므로 host 공개는 개발 도구용 loopback으로 제한한다.
      # Docker가 연 port는 ufw 규칙을 우회하므로 0.0.0.0에 열면 Security Group만이 DB 방어선이 된다.
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-3306}:3306"
    environment:
      # root는 컨테이너 초기화에만 쓰고 애플리케이션은 DB_USER의 일반 계정으로 접속한다.
      # 앱 계정이 유출돼도 root 권한까지 넘어가지 않도록 DB_ROOT_PASSWORD를 분리한다.
      # 미설정이면 기존 설치와 호환되도록 DB_PASSWORD를 쓰며, 값은 data volume 최초 초기화 때만 적용된다.
      # 기존 volume에 새 값만 넣으면 아래 healthcheck가 새 비밀번호로 root 접속해 실패하므로,
      # 먼저 MySQL에서 ALTER USER 'root'@'%'로 root 비밀번호를 바꾼 뒤 설정한다.
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required in .env}}"
      MYSQL_DATABASE: "${DB_NAME:-lingko}"
      MYSQL_USER: "${DB_USER:-lingko}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required in .env}"
      TZ: "${DB_TZ:-Asia/Seoul}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      # 컨테이너를 다시 만들어도 개발 데이터가 유지되도록 Docker 관리 볼륨을 사용한다.
      - mysql_data:/var/lib/mysql
    logging:
      # DB 로그는 CloudWatch 수집 범위 밖에 두되 host disk를 무제한 점유하지 않게 회전한다.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    # CD는 commit SHA tag를 주입하고 로컬 개발은 동일한 기본 image 이름을 사용한다.
    image: "${BACKEND_IMAGE_REPOSITORY:-lingko-backend}:${BACKEND_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lingko-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      # 포트가 열리는 시점이 아니라 MySQL healthcheck가 성공한 뒤 백엔드를 시작한다.
      mysql:
        condition: service_healthy
    ports:
      # TLS reverse proxy가 같은 host에 있으면 APP_BIND_ADDRESS=127.0.0.1로 평문 8080 직접 접근을 막는다.
      # proxy가 다른 host에 있을 수 있어 기본값은 기존 동작(모든 interface)을 유지한다.
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080"
    healthcheck:
      # CD와 같은 애플리케이션 계약을 사용해 JVM 실행만이 아니라 DB 연결까지 판정한다.
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 5 --output /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s
    environment:
      # 컨테이너 내부에서는 localhost가 아닌 Compose 서비스 이름으로 MySQL을 찾는다.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: "${DB_NAME:-lingko}"
      DB_USER: "${DB_USER:-lingko}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required in .env}"
      DB_DRIVER: "${DB_DRIVER:-com.mysql.cj.jdbc.Driver}"
      FFMPEG_PATH: ffmpeg
      # 평가 작업은 별도 evaluation-worker가 처리해 API 프로세스의 외부 호출·임시 파일 부하를 격리한다.
      EVALUATION_WORKER_ENABLED: "${EVALUATION_API_WORKER_ENABLED:-false}"
      # 외부 비용 작업 endpoint는 명시적으로 활성화한 환경에서만 등록한다.
      GUIDE_JOBS_API_ENABLED: "${GUIDE_JOBS_API_ENABLED:-false}"
      GUIDE_JOBS_INTERNAL_TOKEN: "${GUIDE_JOBS_INTERNAL_TOKEN:-}"
      GUIDE_JOBS_REQUESTS_PER_MINUTE: "${GUIDE_JOBS_REQUESTS_PER_MINUTE:-2}"
      GUIDE_JOBS_MAX_CONCURRENT: "${GUIDE_JOBS_MAX_CONCURRENT:-1}"
      # App Review 전용 인증은 기본 비활성화하며 운영 환경이 명시적으로 설정할 때만 열린다.
      REVIEW_ACCESS_ENABLED: "${REVIEW_ACCESS_ENABLED:-false}"
      REVIEW_ACCESS_CODE_SHA256: "${REVIEW_ACCESS_CODE_SHA256:-}"
      REVIEW_ACCESS_USER_ID: "${REVIEW_ACCESS_USER_ID:-}"
      REVIEW_ACCESS_MAX_ATTEMPTS: "${REVIEW_ACCESS_MAX_ATTEMPTS:-5}"
      REVIEW_ACCESS_WINDOW_SECONDS: "${REVIEW_ACCESS_WINDOW_SECONDS:-300}"
      # SSV ad_unit allowlist가 없으면 광고 보상 session endpoint는 fail-closed 된다.
      ADMOB_SSV_ENABLED: "${ADMOB_SSV_ENABLED:-true}"
      ADMOB_SSV_ALLOWED_AD_UNIT_IDS: "${ADMOB_SSV_ALLOWED_AD_UNIT_IDS:-}"
      ADMOB_SSV_REWARD_ITEM: "${ADMOB_SSV_REWARD_ITEM:-pronunciation_chance}"
      ADMOB_SSV_REWARD_AMOUNT: "${ADMOB_SSV_REWARD_AMOUNT:-1}"
    logging:
      # 로컬 실행은 AWS 자격 증명을 요구하지 않으며 host disk 사용량만 제한한다.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  evaluation-worker:
    # API와 Worker가 같은 검증 image를 사용해야 실행 코드가 서로 어긋나지 않는다.
    image: "${BACKEND_IMAGE_REPOSITORY:-lingko-backend}:${BACKEND_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 같은 image를 web server 없이 실행해 평가 부하와 프로세스 장애를 API에서 분리한다.
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: "${DB_NAME:-lingko}"
      DB_USER: "${DB_USER:-lingko}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required in .env}"
      DB_DRIVER: "${DB_DRIVER:-com.mysql.cj.jdbc.Driver}"
      FFMPEG_PATH: ffmpeg
      EVALUATION_WORKER_ENABLED: "true"
      EVALUATION_CLEANUP_ENABLED: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  guide-prewarm:
    profiles: ["operations"]
    image: "${BACKEND_IMAGE_REPOSITORY:-lingko-backend}:${BACKEND_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      FFMPEG_PATH: ffmpeg
      # 대량 실행에서는 FFmpeg debug 전문 대신 진행·실패·cache hit만 남긴다.
      LOG_LEVEL: INFO
    # 기본 API main 대신 DB가 필요 없는 사전 생성 main을 실행한다. profile 때문에 일반 up에는 포함되지 않는다.
    entrypoint:
      - java
      - -Dloader.main=com.lingko.lingko.infra.pronunciation.GuideMediaPrewarmApplication
      - -cp
      - /app/app.jar
      - org.springframework.boot.loader.launch.PropertiesLauncher
    logging:
      # 수동 batch는 평시 CloudWatch 검색 대상에서 제외하고 짧은 로컬 회전 로그만 유지한다.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
