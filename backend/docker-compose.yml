services:
  mysql:
    image: mysql:8.0
    container_name: lingko-mysql
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required in .env}"
      MYSQL_DATABASE: "${DB_NAME:-lingko}"
      MYSQL_USER: "${DB_USER:-lingko}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required in .env}"
      TZ: "${DB_TZ:-Asia/Seoul}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lingko-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: "${DB_NAME:-lingko}"
      DB_USER: "${DB_USER:-lingko}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required in .env}"
      DB_DRIVER: "${DB_DRIVER:-mysql+pymysql}"
      FFMPEG_PATH: ffmpeg

volumes:
  mysql_data:
