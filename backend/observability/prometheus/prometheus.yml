# 로컬 부하 측정용 Prometheus 설정. docker-compose.observability.yml에서만 사용한다.
global:
  # 3분짜리 기준선 측정에서도 변화를 볼 수 있도록 운영(60s)보다 촘촘하게 수집한다.
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: lingko-backend
    metrics_path: /actuator/prometheus
    static_configs:
      # Compose network의 서비스 이름으로 접근한다. host port를 거치지 않는다.
      - targets: ["backend:8080"]
        labels:
          service: api
