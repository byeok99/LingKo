plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lingko'
version = '0.0.1'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

sourceSets {
	integrationTest {
		compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
		runtimeClasspath += output + compileClasspath
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.microsoft.cognitiveservices.speech:client-sdk:1.47.0@jar'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'com.h2database:h2'
	implementation platform('software.amazon.awssdk:bom:2.20.26')
	implementation 'software.amazon.awssdk:s3'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.register('integrationTest', Test) {
	description = 'Runs integration tests that do not call external services.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	shouldRunAfter test
	systemProperty 'spring.profiles.active', 'integration'
	useJUnitPlatform()
	useJUnitPlatform {
		excludeTags 'external'
	}
}

tasks.register('externalIntegrationTest', Test) {
	description = 'Runs integration tests that call external services such as Azure, Replicate, S3, or FFmpeg.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	shouldRunAfter integrationTest
	systemProperty 'spring.profiles.active', 'integration'
	doFirst {
		def requiredEnv = [
				'AZURE_SECRET_KEY',
				'AZURE_REGION',
				'REPLICATE_API_KEY',
				'REPLICATE_VERSION',
				'AWS_S3_BUCKET',
				'AWS_S3_REGION',
				'AWS_ACCESS_KEY',
				'AWS_SECRET_KEY'
		]
		def missingEnv = requiredEnv.findAll { !System.getenv(it) }
		if (!missingEnv.isEmpty()) {
			throw new GradleException("externalIntegrationTest requires environment variables: ${missingEnv.join(', ')}")
		}
	}
	useJUnitPlatform {
		includeTags 'external'
	}
}
