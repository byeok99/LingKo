plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lingko'
version = '0.0.1'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		// 개발 PC와 CI가 같은 언어 기능과 바이트코드를 사용하도록 Java 21 도구 체인을 고정한다.
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

sourceSets {
	// 외부 유료 서비스 없이 DB와 Spring 경계를 검증하는 통합 테스트를 단위 테스트와 분리한다.
	integrationTest {
		compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
		runtimeClasspath += output + compileClasspath
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.microsoft.cognitiveservices.speech:client-sdk:1.47.0@jar'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	// 비용 유발 guide job의 요청·실행 지표를 MeterRegistry에 기록한다.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Apple identity token의 RS256 서명과 JWK rotation을 검증한다.
	implementation 'com.nimbusds:nimbus-jose-jwt:10.9.1'
    testImplementation 'com.h2database:h2'
	implementation platform('software.amazon.awssdk:bom:2.20.26')
	implementation 'software.amazon.awssdk:s3'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	// 약관·처리방침을 Markdown 원본 그대로 두고 서빙 시점에 HTML로 변환한다.
	// HTML 사본을 따로 관리하면 docs/legal 원본과 어긋나기 쉬워 변환을 택했다.
	// 문서에 표가 많아 GFM table 확장을 함께 쓴다.
	implementation 'org.commonmark:commonmark:0.24.0'
	implementation 'org.commonmark:commonmark-ext-gfm-tables:0.24.0'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.register('integrationTest', Test) {
	description = 'Runs integration tests that do not call external services.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	shouldRunAfter test
	systemProperty 'spring.profiles.active', 'integration'
	useJUnitPlatform()
	useJUnitPlatform {
		excludeTags 'external'
	}
}

tasks.register('externalIntegrationTest', Test) {
	description = 'Runs integration tests that call external services such as Azure, Replicate, S3, or FFmpeg.'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	shouldRunAfter integrationTest
	systemProperty 'spring.profiles.active', 'integration'
	doFirst {
		// 외부 호출을 시작하기 전에 필수 비밀값 누락을 한 번에 알려 불완전한 검증을 막는다.
		def requiredEnv = [
				'AZURE_SECRET_KEY',
				'AZURE_REGION',
				'REPLICATE_API_KEY',
				'REPLICATE_VERSION',
				'AWS_S3_BUCKET',
				'AWS_S3_REGION',
				'AWS_ACCESS_KEY',
				'AWS_SECRET_KEY'
		]
		def missingEnv = requiredEnv.findAll { !System.getenv(it) }
		if (!missingEnv.isEmpty()) {
			throw new GradleException("externalIntegrationTest requires environment variables: ${missingEnv.join(', ')}")
		}
	}
	useJUnitPlatform {
		includeTags 'external'
	}
}
