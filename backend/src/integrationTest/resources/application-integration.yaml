spring:
  datasource:
    url: jdbc:h2:mem:lingko_integration;MODE=MySQL;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

jwt:
  secret-key: integration-test-secret-key
  access-token-expire-minutes: 30
  refresh-token-expire-days: 14
  algorithm: HS256

azure:
  secret-key: integration-test-azure-key
  region: koreacentral

replicate:
  api-key: integration-test-replicate-key
  version: integration-test-model-version
  max-poll-attempts: 1
  poll-interval-ms: 1
  frame-rate: 24

aws:
  s3:
    bucket: integration-test-bucket
    region: ap-northeast-2
  credentials:
    access-key: integration-test-access-key
    secret-key: integration-test-secret-key

ffmpeg:
  path: ffmpeg
