name: Docker CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: Compose 설정 검증
        working-directory: backend
        env:
          DB_PASSWORD: ci-only-placeholder
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: Backend image 빌드
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: lingko-backend:ci
          cache-from: type=gha,scope=lingko-backend
          cache-to: type=gha,mode=max,scope=lingko-backend,ignore-error=true

      - name: Runtime image 검증
        run: |
          docker run --rm --entrypoint sh lingko-backend:ci -c '
            test -s /app/app.jar
            java -version
            ffmpeg -version >/dev/null
          '
