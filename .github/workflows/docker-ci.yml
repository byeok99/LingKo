name: Docker CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      # protect-develop이 실패한 required check의 병합을 차단하는지 확인하기 위한 일회성 test branch 전용 단계다.
      - name: CI 실패 병합 차단 리허설
        run: |
          echo "의도적인 실패입니다. 이 PR은 병합하면 안 됩니다."
          exit 1

      - name: Compose 설정 검증
        working-directory: backend
        env:
          DB_PASSWORD: ci-only-placeholder
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: 배포 스크립트 회귀 테스트
        run: ./scripts/tests/deploy-backend-test.sh

      - name: 운영 배포 정책 회귀 테스트
        run: ./scripts/tests/backend-cd-policy-test.sh

      - name: Required check 이름 회귀 테스트
        run: ./scripts/tests/ci-required-checks-test.sh

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: Backend image 빌드
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: lingko-backend:ci
          cache-from: type=gha,scope=lingko-backend
          cache-to: type=gha,mode=max,scope=lingko-backend,ignore-error=true

      - name: Runtime image 검증
        run: |
          docker run --rm --entrypoint sh lingko-backend:ci -c '
            test -s /app/app.jar
            java -version
            ffmpeg -version >/dev/null
          '
