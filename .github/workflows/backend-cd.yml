name: Backend CD

on:
  # 운영 반영은 develop 병합과 분리한다. 배포 담당자가 Actions에서 명시적으로 승인한 실행만 허용한다.
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 운영 Backend 배포를 승인합니다.
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_EC2_INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}

    steps:
      - name: 배포 입력 검증
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONFIRM_PRODUCTION" == "true" ]]
          [[ "$GITHUB_REF_NAME" == "develop" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AWS_REGION" == "us-east-1" ]]
          [[ "$AWS_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
          [[ "$AWS_EC2_INSTANCE_ID" =~ ^i-([0-9a-f]{8}|[0-9a-f]{17})$ ]]

      # 장기 Access Key를 저장하지 않고 production Environment에 한정된 OIDC token을 교환한다.
      - name: AWS 단기 자격 증명 발급
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: LingKo-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: SSM 대상 상태 확인
        shell: bash
        run: |
          set -euo pipefail
          ping_status=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$AWS_EC2_INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)
          [[ "$ping_status" == "Online" ]]

      - name: EC2 배포 명령 전송
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          parameters=$(jq -cn --arg sha "$GITHUB_SHA" '{
            commands: [
              ("sudo -u ubuntu -H bash -lc " + (
                [
                  "set -euo pipefail",
                  "cd /home/ubuntu/LingKo",
                  "test -z \"$(git status --porcelain --untracked-files=no)\"",
                  "git fetch --prune origin develop",
                  ("test \"$(git rev-parse origin/develop)\" = \"" + $sha + "\""),
                  "git switch develop",
                  ("git merge --ff-only \"" + $sha + "\""),
                  ("./scripts/deploy-backend.sh \"" + $sha + "\"")
                ] | join("; ") | @sh
              ))
            ],
            executionTimeout: ["1800"]
          }')

          command_id=$(aws ssm send-command \
            --instance-ids "$AWS_EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --document-version "\$DEFAULT" \
            --comment "LingKo backend $GITHUB_SHA" \
            --timeout-seconds 120 \
            --max-concurrency 1 \
            --max-errors 0 \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)

          [[ "$command_id" =~ ^[0-9a-f-]{36}$ ]]
          echo "command_id=$command_id" >>"$GITHUB_OUTPUT"

      - name: 배포 완료 대기
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail
          result=''
          status=Pending

          for _ in $(seq 1 180); do
            result=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$AWS_EC2_INSTANCE_ID" \
              --output json 2>/dev/null || true)

            if [[ -n "$result" ]]; then
              status=$(jq -r '.Status // "Pending"' <<<"$result")
              case "$status" in
                Success | Failed | TimedOut | Cancelled | Cancelling) break ;;
              esac
            fi
            sleep 10
          done

          if [[ -n "$result" ]]; then
            jq -r '.StandardOutputContent // empty' <<<"$result"
            jq -r '.StandardErrorContent // empty' <<<"$result" >&2
          fi

          [[ "$status" == "Success" ]]
