name: Backend CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@v4

      - name: Java 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*

      - name: Gradle 실행 권한 설정
        run: chmod +x gradlew

      - name: Unit Test
        run: ./gradlew test

      - name: Integration Test
        run: ./gradlew integrationTest

      - name: Coverage 검증
        run: ./gradlew jacocoCombinedTestCoverageVerification

      - name: Spring Boot Build
        run: ./gradlew bootJar
