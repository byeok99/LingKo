name: Backend CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 코드 내려받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Java 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*

      - name: Gradle 실행 권한 설정
        run: chmod +x gradlew

      - name: Unit Test
        run: ./gradlew test

      - name: Integration Test
        run: ./gradlew integrationTest

      - name: Coverage 검증
        run: ./gradlew jacocoCombinedTestCoverageVerification

      - name: Spring Boot Build
        run: ./gradlew bootJar
